<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAUDA PLAYER</title>
  <style>
    :root {
      --rauda-green: #173d2c;
      --rauda-green-2: #24543d;
      --rauda-gold: #c5a25d;
      --rauda-gold-soft: #f1e7cf;
      --rauda-cream: #f7f3e9;
      --rauda-surface: #fffdf8;
      --rauda-text: #1d2b23;
      --rauda-muted: #7a7a6f;
      --rauda-border: #e5dbc4;
      --rauda-shadow: rgba(23, 61, 44, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 0%, rgba(197, 162, 93, 0.12), transparent 28%),
        linear-gradient(180deg, #fbf8f1 0%, var(--rauda-cream) 100%);
      color: var(--rauda-text);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .player-shell {
      width: min(980px, 100%);
      background: rgba(255, 253, 248, 0.9);
      border: 1px solid var(--rauda-border);
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(23, 61, 44, 0.09);
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      background: rgba(255, 253, 248, 0.92);
      border-bottom: 1px solid var(--rauda-border);
    }

    .brand {
      font-weight: 900;
      letter-spacing: 1.2px;
      color: var(--rauda-green);
      font-size: 1.1rem;
    }

    .brand::after {
      content: "";
      display: block;
      width: 42px;
      height: 3px;
      margin-top: 6px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--rauda-gold), var(--rauda-gold-soft));
    }

    .back-link {
      color: var(--rauda-green);
      text-decoration: none;
      font-weight: 700;
      padding: 8px 12px;
      border: 1px solid var(--rauda-border);
      border-radius: 999px;
      background: #fff;
    }

    .content {
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      gap: 24px;
      padding: 24px;
    }

    .player-card,
    .playlist-card {
      background: var(--rauda-surface);
      border: 1px solid var(--rauda-border);
      border-radius: 22px;
      box-shadow: 0 6px 20px rgba(23, 61, 44, 0.04);
    }

    .player-card {
      padding: 22px;
    }

    .cover {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      background:
        linear-gradient(135deg, rgba(23, 61, 44, 0.9), rgba(197, 162, 93, 0.75)),
        url('https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
      position: relative;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .cover::before {
      content: "♫";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: clamp(4rem, 8vw, 6rem);
      color: rgba(255,255,255,0.9);
      text-shadow: 0 8px 24px rgba(0,0,0,0.18);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .tag {
      display: inline-block;
      background: var(--rauda-gold-soft);
      color: #725b2e;
      border: 1px solid #e3d2aa;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .title {
      margin: 0;
      font-size: clamp(1.8rem, 3vw, 2.5rem);
      color: var(--rauda-green);
    }

    .artist {
      margin: 6px 0 0;
      color: var(--rauda-muted);
      font-size: 1rem;
    }

    .controls {
      margin-top: 24px;
    }

    .timeline-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      font-size: 0.82rem;
      color: var(--rauda-muted);
    }

    .timeline {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(to right, var(--rauda-green) 0%, var(--rauda-green) var(--progress, 0%), #ece7dc var(--progress, 0%), #ece7dc 100%);
      outline: none;
      cursor: pointer;
    }

    .timeline::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--rauda-green);
      border: 2px solid #fff;
      box-shadow: 0 0 0 3px rgba(23, 61, 44, 0.12);
    }

    .timeline::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border: 0;
      border-radius: 50%;
      background: var(--rauda-green);
      box-shadow: 0 0 0 3px rgba(23, 61, 44, 0.12);
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .transport {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-button {
      border: 1px solid var(--rauda-border);
      background: #fff;
      color: var(--rauda-green);
      border-radius: 50%;
      width: 46px;
      height: 46px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-button:hover {
      background: var(--rauda-gold-soft);
      border-color: #d9c79f;
    }

    .play-button {
      width: 60px;
      height: 60px;
      font-size: 1.4rem;
      background: linear-gradient(180deg, #214c38 0%, var(--rauda-green) 100%);
      color: #fff;
      border: 1px solid #294f3c;
      box-shadow: 0 6px 16px rgba(23, 61, 44, 0.18);
    }

    .volume-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 150px;
      justify-content: flex-end;
    }

    .volume {
      width: 100%;
      max-width: 120px;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(to right, var(--rauda-green) 0%, var(--rauda-green) var(--volume, 70%), #ece7dc var(--volume, 70%), #ece7dc 100%);
      outline: none;
      cursor: pointer;
    }

    .volume::-webkit-slider-thumb,
    .volume::-moz-range-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border: 0;
      border-radius: 50%;
      background: var(--rauda-green);
    }

    .playlist-card {
      padding: 20px;
    }

    .playlist-heading {
      margin: 0 0 14px;
      font-size: 1.1rem;
      color: var(--rauda-green);
    }

    .playlist {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }

    .track {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 14px;
      padding: 10px 12px;
      text-align: left;
      cursor: pointer;
      color: var(--rauda-text);
      transition: all 0.2s ease;
    }

    .track:hover {
      background: var(--rauda-gold-soft);
      border-color: #e3d2aa;
    }

    .track.active {
      background: #edf5ef;
      border-color: rgba(23, 61, 44, 0.15);
    }

    .track-number {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #f1f4f0;
      color: var(--rauda-green);
      font-size: 0.8rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .track-info {
      min-width: 0;
      flex: 1;
    }

    .track-name {
      display: block;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-author {
      display: block;
      color: var(--rauda-muted);
      font-size: 0.8rem;
      margin-top: 2px;
    }

    .track-duration {
      color: var(--rauda-muted);
      font-size: 0.8rem;
      margin-left: 8px;
    }

    @media (max-width: 760px) {
      .content {
        grid-template-columns: 1fr;
      }

      .actions {
        flex-direction: column;
        align-items: stretch;
      }

      .transport,
      .volume-wrap {
        justify-content: center;
      }

      .volume-wrap {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="player-shell">
    <div class="topbar">
      <div class="brand">RAUDA PLAYER</div>
      <a class="back-link" href="./index.html">Назад</a>
    </div>

    <div class="content">
      <section class="player-card">
        <div class="cover" aria-hidden="true"></div>

        <div class="meta">
          <span class="tag">Now playing</span>
        </div>

        <h1 class="title" id="trackTitle">Midnight Echo</h1>
        <p class="artist" id="trackArtist">RAUDA Studio</p>

        <div class="controls">
          <div class="timeline-wrap">
            <span id="currentTime">00:00</span>
            <input id="timeline" class="timeline" type="range" min="0" max="100" value="0" aria-label="Progress" />
            <span id="totalTime">00:00</span>
          </div>

          <div class="actions">
            <div class="transport">
              <button class="icon-button" id="prevBtn" aria-label="Previous track">⏮</button>
              <button class="icon-button play-button" id="playBtn" aria-label="Play or pause">▶</button>
              <button class="icon-button" id="nextBtn" aria-label="Next track">⏭</button>
            </div>

            <div class="volume-wrap">
              <span>🔊</span>
              <input id="volume" class="volume" type="range" min="0" max="100" value="70" aria-label="Volume" />
            </div>
          </div>
        </div>

        <audio id="audio" preload="metadata"></audio>
      </section>

      <aside class="playlist-card">
        <h2 class="playlist-heading">Плейлист</h2>
        <ul class="playlist" id="playlist"></ul>
      </aside>
    </div>
  </div>

  <script>
    const tracks = [
      {
        title: 'Midnight Echo',
        artist: 'RAUDA Studio',
        duration: '03:24',
        src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'
      },
      {
        title: 'Golden Horizon',
        artist: 'RAUDA Studio',
        duration: '04:11',
        src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3'
      },
      {
        title: 'Quiet Fire',
        artist: 'RAUDA Studio',
        duration: '03:48',
        src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3'
      }
    ];

    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const timeline = document.getElementById('timeline');
    const volume = document.getElementById('volume');
    const currentTimeEl = document.getElementById('currentTime');
    const totalTimeEl = document.getElementById('totalTime');
    const trackTitle = document.getElementById('trackTitle');
    const trackArtist = document.getElementById('trackArtist');
    const playlist = document.getElementById('playlist');

    let currentTrackIndex = 0;

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return '00:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function renderPlaylist() {
      playlist.innerHTML = tracks.map((track, index) => `
        <li>
          <button class="track ${index === currentTrackIndex ? 'active' : ''}" data-index="${index}" type="button">
            <span class="track-number">${index + 1}</span>
            <span class="track-info">
              <span class="track-name">${track.title}</span>
              <span class="track-author">${track.artist}</span>
            </span>
            <span class="track-duration">${track.duration}</span>
          </button>
        </li>
      `).join('');

      document.querySelectorAll('.track').forEach((button) => {
        button.addEventListener('click', () => {
          currentTrackIndex = Number(button.dataset.index);
          loadTrack();
          playAudio();
        });
      });
    }

    function updateTimelineStyle(value) {
      const percent = (value / timeline.max) * 100;
      timeline.style.setProperty('--progress', `${percent}%`);
    }

    function updateVolumeStyle(value) {
      const percent = (value / volume.max) * 100;
      volume.style.setProperty('--volume', `${percent}%`);
    }

    function loadTrack() {
      const track = tracks[currentTrackIndex];
      trackTitle.textContent = track.title;
      trackArtist.textContent = track.artist;
      audio.src = track.src;
      audio.load();
      totalTimeEl.textContent = track.duration;
      renderPlaylist();
    }

    function playAudio() {
      audio.play().catch(() => {
        playBtn.textContent = '▶';
      });
      playBtn.textContent = '⏸';
    }

    function pauseAudio() {
      audio.pause();
      playBtn.textContent = '▶';
    }

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        playAudio();
      } else {
        pauseAudio();
      }
    });

    prevBtn.addEventListener('click', () => {
      currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
      loadTrack();
      playAudio();
    });

    nextBtn.addEventListener('click', () => {
      currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
      loadTrack();
      playAudio();
    });

    timeline.addEventListener('input', (event) => {
      const value = Number(event.target.value);
      const duration = audio.duration || 0;
      if (duration) {
        audio.currentTime = (value / 100) * duration;
      }
      updateTimelineStyle(value);
    });

    volume.addEventListener('input', (event) => {
      const value = Number(event.target.value);
      audio.volume = value / 100;
      updateVolumeStyle(value);
    });

    audio.addEventListener('timeupdate', () => {
      const current = audio.currentTime || 0;
      const duration = audio.duration || 0;
      currentTimeEl.textContent = formatTime(current);
      const percent = duration ? (current / duration) * 100 : 0;
      timeline.value = percent;
      updateTimelineStyle(percent);
    });

    audio.addEventListener('ended', () => {
      currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
      loadTrack();
      playAudio();
    });

    audio.addEventListener('loadedmetadata', () => {
      totalTimeEl.textContent = formatTime(audio.duration || 0);
    });

    audio.addEventListener('play', () => {
      playBtn.textContent = '⏸';
    });

    audio.addEventListener('pause', () => {
      playBtn.textContent = '▶';
    });

    volume.value = 70;
    updateVolumeStyle(70);
    audio.volume = 0.7;
    loadTrack();
  </script>
</body>
</html>
