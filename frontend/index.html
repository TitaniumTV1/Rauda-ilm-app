<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rauda Ilm — Онлайн-школа</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #F4F5F7;
      --bg-header: #FFFFFF;
      --bg-card: #FFFFFF;
      --bg-card-hover: #FAFAFC;
      --bg-subtle: #EDEEF2;
      --bg-input: #FFFFFF;
      --bg-pill-active: #E6E8EE;

      --border-color: #DDE1E8;
      --border-gold: #C5A059;

      --text-main: #111827;
      --text-muted: #4B5563;

      --gold-primary: #B8860B;
      --gold-dark: #8B6508;
      --gold-gradient: linear-gradient(135deg, #C5A059 0%, #996515 100%);

      --danger: #DC2626;
      --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.1);
      --shadow-hover: 0 4px 6px -1px rgba(0, 0, 0, 0.1);

      --radius-lg: 12px;
      --radius-md: 8px;
      --radius-sm: 6px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .navbar {
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
      padding: 0 20px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-card);
    }

    .navbar-inner {
      max-width: 1160px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      cursor: pointer;
      user-select: none;
    }

    .brand img {
      height: 40px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 18px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .nav-links::-webkit-scrollbar { display: none; }

    .nav-item {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      position: relative;
      padding: 8px 0;
      transition: color 0.2s;
    }

    .nav-item:hover,
    .nav-item.active {
      color: var(--text-main);
      font-weight: 600;
    }

    .nav-item.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--gold-primary);
    }

    .nav-badge {
      background: var(--gold-primary);
      color: #fff;
      font-size: 10px;
      font-weight: 600;
      padding: 1px 5px;
      border-radius: 4px;
      position: relative;
      top: -6px;
      margin-left: 2px;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lang-pill {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .icon-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--bg-pill-active);
      border: 1px solid var(--border-gold);
      color: var(--gold-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      transition: all 0.2s;
    }

    .container {
      max-width: 1060px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }

    .page-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--text-main);
    }

    .pills-bar {
      display: inline-flex;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 4px;
      border-radius: var(--radius-md);
      margin-bottom: 12px;
      gap: 4px;
      flex-wrap: wrap;
      box-shadow: var(--shadow-card);
    }

    .pill-label {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
    }

    .pill-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .pill-btn.active {
      background: var(--bg-pill-active);
      border-color: var(--border-gold);
      color: var(--gold-dark);
      font-weight: 600;
    }

    .empty-state {
      background: var(--bg-card);
      border: 1px dashed var(--border-color);
      border-radius: var(--radius-lg);
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      margin: 20px 0;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin: 20px 0 30px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: var(--shadow-card);
    }

    .stat-card.col-layout {
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 10px;
    }

    .stat-big-num {
      font-size: 28px;
      font-weight: 700;
      color: var(--gold-primary);
      line-height: 1;
    }

    .stat-title {
      font-size: 12px;
      color: var(--text-muted);
    }

    .progress-line {
      width: 100%;
      height: 6px;
      background: var(--bg-subtle);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--gold-primary);
      border-radius: 99px;
    }

    .books-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .book-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 18px;
      display: flex;
      gap: 16px;
      cursor: pointer;
      box-shadow: var(--shadow-card);
      transition: border-color 0.2s;
    }

    .book-card:hover {
      border-color: var(--border-gold);
    }

    .book-cover {
      width: 80px;
      height: 115px;
      border-radius: var(--radius-sm);
      background: var(--bg-subtle);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
    }

    .book-info {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
    }

    .book-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .book-author {
      font-size: 12px;
      color: var(--text-muted);
    }

    .profile-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-items: start;
    }

    .profile-col {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .profile-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-card);
    }

    .profile-card-heading {
      font-size: 14px;
      font-weight: 600;
      color: var(--gold-dark);
      margin-bottom: 14px;
    }

    .profile-field-group {
      margin-bottom: 14px;
    }
    .profile-field-group:last-child {
      margin-bottom: 0;
    }

    .profile-field-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .profile-input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-family: inherit;
    }

    .btn-gold {
      background: var(--gold-primary);
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }

    .btn-gold:hover {
      background: var(--gold-dark);
    }

    .btn-outline-red {
      background: #FFF8F8;
      color: var(--danger);
      border: 1px solid rgba(220, 38, 38, 0.3);
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      cursor: pointer;
      font-size: 13px;
    }

    .admin-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .admin-box {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 20px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-card);
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-family: inherit;
    }

    .upload-inline {
      display: flex;
      gap: 8px;
    }

    .btn-upload {
      background: var(--bg-pill-active);
      color: var(--gold-dark);
      border: 1px solid var(--border-gold);
      padding: 0 10px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
    }

    @media (max-width: 768px) {
      .stats-grid, .books-grid, .admin-grid, .profile-grid {
        grid-template-columns: 1fr;
      }
      .navbar { padding: 0 12px; }
      .container { padding: 16px 12px 40px; }
    }
  </style>
</head>

  <main class="container" id="app-root"></main>

  <script>
    const API_BASE_URL = "";

    const state = {
      view: 'home',
      profileTab: 'profile',
      program: 'prep',
      semester: 1,
      selectedBookId: null,
      selectedLessonId: null,
      lessonTab: 'lesson',
      videoMode: 'sub',
      quizSubmitted: false,
      quizAnswers: {},

      user: {
        id: '550',
        firstName: 'Ученик',
        lastName: '',
        email: '',
        tgId: '',
        tgUsername: '',
        isLoggedIn: true
      },

      // Пустые списки — вы создадите их через админку
      books: [],
      lessons: []
    };

    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe?.user) {
      const tgUser = window.Telegram.WebApp.initDataUnsafe.user;
      state.user.firstName = tgUser.first_name || 'Ученик';
      state.user.lastName = tgUser.last_name || '';
      state.user.tgId = String(tgUser.id || '');
      state.user.tgUsername = tgUser.username ? `@${tgUser.username}` : '';
      window.Telegram.WebApp.expand();
    }

    function navigate(view, params = {}) {
      if (!state.user.isLoggedIn && view !== 'login') {
        state.view = 'login';
        render();
        return;
      }

      state.view = view;
      if (params.bookId) state.selectedBookId = params.bookId;
      if (params.lessonId) state.selectedLessonId = params.lessonId;
      if (params.lessonTab) state.lessonTab = params.lessonTab;

      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      const navMap = { home: 'nav-home', schedule: 'nav-schedule', exams: 'nav-exams', certs: 'nav-certs', admin: 'nav-admin' };
      if (navMap[view]) document.getElementById(navMap[view])?.classList.add('active');

      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function render() {
      const root = document.getElementById('app-root');
      document.getElementById('badge-lessons-count').textContent = state.lessons.length;

      if (!state.user.isLoggedIn) {
        root.innerHTML = renderLogin();
        return;
      }

      if (state.view === 'home') root.innerHTML = renderHome();
      else if (state.view === 'book') root.innerHTML = renderBookDetail();
      else if (state.view === 'lesson') {
        root.innerHTML = renderLessonPage();
        initLessonMediaPlayers();
      }
      else if (state.view === 'profile') root.innerHTML = renderProfilePage();
      else if (state.view === 'schedule') root.innerHTML = renderSchedule();
      else if (state.view === 'exams') root.innerHTML = renderExams();
      else if (state.view === 'certs') root.innerHTML = renderCerts();
      else if (state.view === 'admin') root.innerHTML = renderAdmin();
    }

    function renderLogin() {
      return `
        <div style="max-width: 400px; margin: 40px auto; background: var(--bg-card); padding: 30px; border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-card);">
          <h2 style="margin-bottom: 20px; font-size: 20px;">Авторизация в онлайн-школе</h2>
          <div class="form-group">
            <label>Ваше имя</label>
            <input type="text" id="login-name" class="profile-input" value="${state.user.firstName}" />
          </div>
          <button class="btn-gold" style="width: 100%; justify-content: center; margin-top: 10px;" onclick="performLogin()">Войти в систему</button>
        </div>
      `;
    }

    function performLogin() {
      const name = document.getElementById('login-name')?.value.trim();
      if (name) state.user.firstName = name;
      state.user.isLoggedIn = true;
      navigate('home');
    }

    function logoutAccount() {
      state.user.isLoggedIn = false;
      render();
    }

    function renderProfilePage() {
      const u = state.user;
      return `
        <div class="profile-tabs-header" style="display:flex; gap:20px; margin-bottom:20px;">
          <span style="font-size: 20px; font-weight:700; cursor:pointer;">Профиль ученика</span>
        </div>
        <div class="profile-grid">
          <div class="profile-col">
            <div class="profile-card">
              <div class="profile-card-heading">Личные данные</div>
              <div class="profile-field-group">
                <label class="profile-field-label">Имя</label>
                <input type="text" id="prof-first-name" class="profile-input" value="${u.firstName}" onchange="saveProfile()" />
              </div>
              <div class="profile-field-group">
                <label class="profile-field-label">Фамилия</label>
                <input type="text" id="prof-last-name" class="profile-input" value="${u.lastName}" onchange="saveProfile()" />
              </div>
            </div>
          </div>
          <div class="profile-col">
            <div class="profile-card">
              <div class="profile-card-heading">Безопасность и сессия</div>
              <button class="btn-outline-red" onclick="logoutAccount()">Выйти из аккаунта</button>
            </div>
          </div>
        </div>
      `;
    }

    function saveProfile() {
      state.user.firstName = document.getElementById('prof-first-name')?.value.trim() || 'Ученик';
      state.user.lastName = document.getElementById('prof-last-name')?.value.trim() || '';
    }

    function renderHome() {
      const filteredBooks = state.books.filter(
        b => b.program === state.program && Number(b.semester) === Number(state.semester)
      );

      return `
        <h1 class="page-title">С возвращением, ${state.user.firstName}!</h1>

        <div>
          <div class="pills-bar">
            <span class="pill-label">Программа</span>
            <button class="pill-btn ${state.program === 'prep' ? 'active' : ''}" onclick="setProgram('prep')">Подготовительный</button>
            <button class="pill-btn ${state.program === 'tajweed' ? 'active' : ''}" onclick="setProgram('tajweed')">Таджвид</button>
          </div>
        </div>

        <div>
          <div class="pills-bar">
            <span class="pill-label">Семестр</span>
            <button class="pill-btn ${state.semester === 1 ? 'active' : ''}" onclick="setSemester(1)">1 семестр</button>
            <button class="pill-btn ${state.semester === 2 ? 'active' : ''}" onclick="setSemester(2)">2 семестр</button>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-card col-layout">
            <div class="stat-title">Программа пройдена</div>
            <div class="stat-big-num">0%</div>
            <div class="progress-line"><div class="progress-fill" style="width: 0%;"></div></div>
          </div>
          <div class="stat-card">
            <div>
              <div class="stat-title">Средний балл по тестам</div>
              <div class="stat-big-num">0%</div>
            </div>
          </div>
          <div class="stat-card">
            <div>
              <div class="stat-title">Сданные экзамены</div>
              <div class="stat-big-num">0</div>
            </div>
          </div>
        </div>

        <h2 class="section-heading">Учебная программа</h2>
        <p class="section-sub">Здесь будут отображаться созданные вами курсы и книги</p>

        ${filteredBooks.length === 0 ? `
          <div class="empty-state">
            Пока не создано ни одной книги или программы. Перейдите в раздел Админка, чтобы добавить первый курс.
          </div>
        ` : `
          <div class="books-grid">
            ${filteredBooks.map(book => `
              <div class="book-card" onclick="navigate('book', { bookId: ${book.id} })">
                <div class="book-cover">Обложка</div>
                <div class="book-info">
                  <div>
                    <div class="book-title">${book.title}</div>
                    <div class="book-author">Автор: ${book.author}</div>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        `}
      `;
    }

    function setProgram(prog) { state.program = prog; render(); }
    function setSemester(sem) { state.semester = sem; render(); }

    function renderBookDetail() {
      const book = state.books.find(b => b.id === Number(state.selectedBookId)) || state.books[0];
      if (!book) return `<div class="container"><button class="back-btn" onclick="navigate('home')">Назад</button><div class="empty-state">Книга не найдена</div></div>`;
      const bookLessons = state.lessons.filter(l => Number(l.book_id) === Number(book.id));

      return `
        <div style="display: grid; grid-template-columns: 100px 1fr; gap: 16px; align-items: start;">
          <button class="back-btn" onclick="navigate('home')">Назад</button>
          <div>
            <div class="profile-card" style="margin-bottom: 20px;">
              <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 6px;">${book.title}</h2>
              <div style="font-size: 13px; color: var(--text-muted);">Преподаватель: ${book.author}</div>
            </div>
            <h3 class="section-heading">Список уроков</h3>
            ${bookLessons.length === 0 ? `<div class="empty-state">В этой книге пока нет уроков. Добавьте их через админку.</div>` : bookLessons.map(l => `
              <div class="lesson-row" onclick="navigate('lesson', { lessonId: ${l.id} })">
                <div>
                  <div class="lesson-row-title">${l.title}</div>
                  <span class="lesson-row-sub">Урок</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderLessonPage() {
      const lesson = state.lessons.find(l => l.id === Number(state.selectedLessonId)) || state.lessons[0];
      if (!lesson) return `<div class="container"><button class="back-btn" onclick="navigate('home')">Назад</button><div class="empty-state">Урок не найден</div></div>`;
      const activeVideoUrl = state.videoMode === 'sub' ? lesson.video_sub_url : lesson.video_voice_url;

      return `
        <div class="lesson-page-grid">
          <div>
            <button class="back-btn" style="margin-bottom: 16px;" onclick="navigate('book', { bookId: ${lesson.book_id} })">К книге</button>
          </div>
          <div>
            <div class="lesson-header-card">
              <h2>${lesson.title}</h2>
            </div>
            <div class="player-card">
              <div class="player-topbar">
                <div class="player-topbar-title">Видеоформат</div>
                <div class="mode-switch">
                  <button type="button" class="mode-btn ${state.videoMode === 'sub' ? 'active' : ''}" onclick="switchVideoMode('sub')">Субтитры</button>
                  <button type="button" class="mode-btn ${state.videoMode === 'voice' ? 'active' : ''}" onclick="switchVideoMode('voice')">Озвучка</button>
                </div>
              </div>
              <div class="custom-video-container" id="video-box">
                <div class="video-mode-indicator">${state.videoMode === 'sub' ? 'Субтитры' : 'Озвучка'}</div>
                <video id="dual-video-player" controls preload="metadata" src="${activeVideoUrl || ''}"></video>
              </div>
            </div>
            ${lesson.audio_url ? `
              <div class="audio-card">
                <div class="audio-header"><div class="player-topbar-title">Аудиоформат</div><a href="${lesson.audio_url}" download class="btn-upload">Скачать MP3</a></div>
                <audio controls src="${lesson.audio_url}" style="width: 100%;"></audio>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    function switchVideoMode(mode) {
      state.videoMode = mode;
      render();
    }

    function initLessonMediaPlayers() {}

    function renderSchedule() {
      return `<h1 class="page-title">Расписание</h1><div class="empty-state">Расписание пока не заполнено.</div>`;
    }
    function renderExams() {
      return `<h1 class="page-title">Экзамены</h1><div class="empty-state">Активных экзаменов нет.</div>`;
    }
    function renderCerts() {
      return `<h1 class="page-title">Сертификаты</h1><div class="empty-state">У вас пока нет сертификатов.</div>`;
    }

    function renderAdmin() {
      return `
        <h1 class="page-title">Управление онлайн-школой (Админка)</h1>
        <div class="admin-grid">
          <div class="admin-box">
            <h3 style="margin-bottom: 14px; font-size: 15px; color: var(--gold-dark);">Создать книгу или курс</h3>
            <div class="form-group"><label>Название книги</label><input type="text" id="adm-book-title" class="form-input" placeholder="Основы веры" /></div>
            <div class="form-group"><label>Автор / Преподаватель</label><input type="text" id="adm-book-author" class="form-input" placeholder="Шейх" /></div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
              <div class="form-group"><label>Программа</label><select id="adm-book-prog" class="form-select"><option value="prep">Подготовительный</option><option value="tajweed">Таджвид</option></select></div>
              <div class="form-group"><label>Семестр</label><input type="number" id="adm-book-sem" class="form-input" value="1" /></div>
            </div>
            <button class="btn-gold" style="width:100%; justify-content:center;" onclick="saveBookFromAdmin()">Создать книгу</button>
          </div>

          <div class="admin-box">
            <h3 style="margin-bottom: 14px; font-size: 15px; color: var(--gold-dark);">Добавить урок к книге</h3>
            <div class="form-group"><label>Книга</label><select id="adm-lesson-book" class="form-select">${state.books.map(b => `<option value="${b.id}">${b.title}</option>`).join('')}</select></div>
            <div class="form-group"><label>Название урока</label><input type="text" id="adm-lesson-title" class="form-input" placeholder="1 урок" /></div>
            <div class="form-group"><label>Ссылка на видео (Субтитры)</label><input type="text" id="adm-video-sub" class="form-input" placeholder="https://..." /></div>
            <div class="form-group"><label>Ссылка на видео (Озвучка)</label><input type="text" id="adm-video-voice" class="form-input" placeholder="https://..." /></div>
            <div class="form-group"><label>Ссылка на аудио</label><input type="text" id="adm-audio-url" class="form-input" placeholder="https://..." /></div>
            <button class="btn-gold" style="width:100%; justify-content:center;" onclick="saveLessonFromAdmin()">Сохранить урок</button>
          </div>
        </div>
      `;
    }

    function saveBookFromAdmin() {
      const title = document.getElementById('adm-book-title')?.value.trim();
      const author = document.getElementById('adm-book-author')?.value.trim();
      const program = document.getElementById('adm-book-prog')?.value;
      const semester = Number(document.getElementById('adm-book-sem')?.value) || 1;
      if (!title) return alert('Введите название книги');

      state.books.push({ id: Date.now(), title, author: author || 'Преподаватель', program, semester });
      render();
      alert('Книга успешно создана!');
    }

    function saveLessonFromAdmin() {
      const book_id = Number(document.getElementById('adm-lesson-book')?.value);
      const title = document.getElementById('adm-lesson-title')?.value.trim();
      const video_sub_url = document.getElementById('adm-video-sub')?.value.trim();
      const video_voice_url = document.getElementById('adm-video-voice')?.value.trim();
      const audio_url = document.getElementById('adm-audio-url')?.value.trim();
      if (!book_id || !title) return alert('Выберите книгу и введите название урока');

      state.lessons.push({ id: Date.now(), book_id, title, video_sub_url, video_voice_url, audio_url });
      render();
      alert('Урок успешно добавлен!');
    }

    render();
  </script>
</body>
</html>
