<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rauda Ilm — Онлайн-школа</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #F1F5F9;
      --bg-header: #FFFFFF;
      --bg-card: #FFFFFF;
      --bg-subtle: #E2E8F0;
      --border-color: #CBD5E1;
      --text-main: #0F172A;
      --text-muted: #475569;
      --accent: #0F172A;
      --accent-hover: #334155;
      --danger: #991B1B;
      --radius: 2px; /* Строгие прямые углы */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      line-height: 1.4;
      font-size: 13px;
    }

    .navbar {
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar-inner {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-main);
      cursor: pointer;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-item {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      padding: 6px 0;
      border-bottom: 2px solid transparent;
    }

    .nav-item:hover,
    .nav-item.active {
      color: var(--text-main);
      border-bottom-color: var(--text-main);
    }

    .nav-badge {
      background: var(--text-main);
      color: #fff;
      font-size: 10px;
      padding: 1px 4px;
      border-radius: var(--radius);
      margin-left: 4px;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-system {
      background: var(--accent);
      color: #FFFFFF;
      border: none;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border-radius: var(--radius);
      font-family: inherit;
    }

    .btn-system:hover {
      background: var(--accent-hover);
    }

    .btn-outline {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border-radius: var(--radius);
      font-family: inherit;
    }

    .btn-outline:hover {
      background: var(--bg-subtle);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    .page-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--text-main);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .tabs-bar {
      display: flex;
      gap: 2px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .tab-btn {
      background: transparent;
      border: none;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }

    .tab-btn.active {
      color: var(--text-main);
      border-bottom-color: var(--text-main);
      font-weight: 600;
    }

    .empty-state {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 30px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      border-radius: var(--radius);
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 16px;
      border-radius: var(--radius);
    }

    .card-title {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-value {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .form-control {
      width: 100%;
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 10px;
      font-size: 13px;
      border-radius: var(--radius);
      font-family: inherit;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--text-main);
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
    }

    .table th, .table td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
      font-size: 13px;
    }

    .table th {
      background: var(--bg-subtle);
      font-weight: 600;
      color: var(--text-main);
    }

    .table tr:last-child td {
      border-bottom: none;
    }

    @media (max-width: 768px) {
      .grid-3, .grid-2, .navbar-inner {
        grid-template-columns: 1fr;
        flex-direction: column;
        align-items: stretch;
      }
      .nav-links { overflow-x: auto; width: 100%; padding-bottom: 4px; }
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="navbar-inner">
      <a class="brand" onclick="navigate('home')">Rauda Ilm</a>

      <nav class="nav-links">
        <a class="nav-item active" id="nav-home" onclick="navigate('home')">Уроки <span class="nav-badge" id="badge-lessons-count">0</span></a>
        <a class="nav-item" id="nav-schedule" onclick="navigate('schedule')">Расписание</a>
        <a class="nav-item" id="nav-exams" onclick="navigate('exams')">Экзамены</a>
        <a class="nav-item" id="nav-certs" onclick="navigate('certs')">Сертификаты</a>
        <a class="nav-item" id="nav-admin" onclick="navigate('admin')">Администрирование</a>
      </nav>

      <div class="nav-actions">
        <button class="btn-outline" style="padding: 4px 8px; font-size: 11px;">RU</button>
        <button class="btn-outline" onclick="navigate('profile')">Кабинет</button>
      </div>
    </div>
  </header>

  <main class="container" id="app-root"></main>

  <script>
    const API_BASE_URL = "";

    const state = {
      view: 'home',
      program: 'prep',
      semester: 1,
      selectedBookId: null,
      selectedLessonId: null,
      videoMode: 'sub',
      user: {
        id: '550',
        firstName: 'Ученик',
        lastName: '',
        isLoggedIn: true
      },
      books: [],
      lessons: []
    };

    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe?.user) {
      const tgUser = window.Telegram.WebApp.initDataUnsafe.user;
      state.user.firstName = tgUser.first_name || 'Ученик';
      state.user.lastName = tgUser.last_name || '';
      window.Telegram.WebApp.expand();
    }

    function navigate(view, params = {}) {
      if (!state.user.isLoggedIn && view !== 'login') {
        state.view = 'login';
        render();
        return;
      }

      state.view = view;
      if (params.bookId) state.selectedBookId = params.bookId;
      if (params.lessonId) state.selectedLessonId = params.lessonId;

      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      const navMap = { home: 'nav-home', schedule: 'nav-schedule', exams: 'nav-exams', certs: 'nav-certs', admin: 'nav-admin' };
      if (navMap[view]) document.getElementById(navMap[view])?.classList.add('active');

      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function render() {
      const root = document.getElementById('app-root');
      document.getElementById('badge-lessons-count').textContent = state.lessons.length;

      if (!state.user.isLoggedIn) {
        root.innerHTML = renderLogin();
        return;
      }

      if (state.view === 'home') root.innerHTML = renderHome();
      else if (state.view === 'book') root.innerHTML = renderBookDetail();
      else if (state.view === 'lesson') root.innerHTML = renderLessonPage();
      else if (state.view === 'profile') root.innerHTML = renderProfilePage();
      else if (state.view === 'schedule') root.innerHTML = renderSchedule();
      else if (state.view === 'exams') root.innerHTML = renderExams();
      else if (state.view === 'certs') root.innerHTML = renderCerts();
      else if (state.view === 'admin') root.innerHTML = renderAdmin();
    }

    function renderLogin() {
      return `
        <div style="max-width: 360px; margin: 40px auto; background: var(--bg-card); padding: 24px; border: 1px solid var(--border-color); border-radius: var(--radius);">
          <h2 style="font-size: 16px; font-weight: 600; margin-bottom: 16px;">Авторизация</h2>
          <div class="form-group">
            <label>Имя пользователя</label>
            <input type="text" id="login-name" class="form-control" value="${state.user.firstName}" />
          </div>
          <button class="btn-system" style="width: 100%; margin-top: 8px;" onclick="performLogin()">Войти</button>
        </div>
      `;
    }

    function performLogin() {
      const name = document.getElementById('login-name')?.value.trim();
      if (name) state.user.firstName = name;
      state.user.isLoggedIn = true;
      navigate('home');
    }

    function logoutAccount() {
      state.user.isLoggedIn = false;
      render();
    }

    function renderProfilePage() {
      const u = state.user;
      return `
        <h1 class="page-title">Личный кабинет ученика</h1>
        <div class="grid-2">
          <div class="card">
            <div class="card-title">Учетные данные</div>
            <div class="form-group">
              <label>Имя</label>
              <input type="text" id="prof-first-name" class="form-control" value="${u.firstName}" onchange="saveProfile()" />
            </div>
            <div class="form-group">
              <label>Фамилия</label>
              <input type="text" id="prof-last-name" class="form-control" value="${u.lastName}" onchange="saveProfile()" />
            </div>
          </div>
          <div class="card">
            <div class="card-title">Сеанс</div>
            <button class="btn-outline" style="color: var(--danger); border-color: var(--danger);" onclick="logoutAccount()">Завершить сеанс</button>
          </div>
        </div>
      `;
    }

    function saveProfile() {
      state.user.firstName = document.getElementById('prof-first-name')?.value.trim() || 'Ученик';
      state.user.lastName = document.getElementById('prof-last-name')?.value.trim() || '';
    }

    function renderHome() {
      const filteredBooks = state.books.filter(
        b => b.program === state.program && Number(b.semester) === Number(state.semester)
      );

      return `
        <h1 class="page-title">Учебный план: ${state.user.firstName}</h1>

        <div class="tabs-bar">
          <button class="tab-btn ${state.program === 'prep' ? 'active' : ''}" onclick="setProgram('prep')">Подготовительный</button>
          <button class="tab-btn ${state.program === 'tajweed' ? 'active' : ''}" onclick="setProgram('tajweed')">Таджвид</button>
        </div>

        <div class="tabs-bar">
          <button class="tab-btn ${state.semester === 1 ? 'active' : ''}" onclick="setSemester(1)">Семестр 1</button>
          <button class="tab-btn ${state.semester === 2 ? 'active' : ''}" onclick="setSemester(2)">Семестр 2</button>
        </div>

        <div class="grid-3">
          <div class="card">
            <div class="card-title">Прогресс</div>
            <div class="card-value">0%</div>
          </div>
          <div class="card">
            <div class="card-title">Средний балл</div>
            <div class="card-value">0.0</div>
          </div>
          <div class="card">
            <div class="card-title">Экзамены</div>
            <div class="card-value">0 / 0</div>
          </div>
        </div>

        <h2 style="font-size: 15px; font-weight: 600; margin-bottom: 12px;">Дисциплины семестра</h2>
        
        ${filteredBooks.length === 0 ? `
          <div class="empty-state">Дисциплины не найдены. Воспользуйтесь панелью администратора для добавления материалов.</div>
        ` : `
          <div class="grid-2">
            ${filteredBooks.map(book => `
              <div class="card" style="cursor: pointer;" onclick="navigate('book', { bookId: ${book.id} })">
                <div style="font-weight: 600; font-size: 14px; margin-bottom: 4px;">${book.title}</div>
                <div style="font-size: 12px; color: var(--text-muted);">Преподаватель: ${book.author}</div>
              </div>
            `).join('')}
          </div>
        `}
      `;
    }

    function setProgram(prog) { state.program = prog; render(); }
    function setSemester(sem) { state.semester = sem; render(); }

    function renderBookDetail() {
      const book = state.books.find(b => b.id === Number(state.selectedBookId));
      if (!book) return `<div class="container"><button class="btn-outline" onclick="navigate('home')">Назад</button><div class="empty-state" style="margin-top:16px;">Материал не найден</div></div>`;
      const bookLessons = state.lessons.filter(l => Number(l.book_id) === Number(book.id));

      return `
        <div style="margin-bottom: 16px;"><button class="btn-outline" onclick="navigate('home')">Назад к списку</button></div>
        <h1 class="page-title">${book.title}</h1>
        <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">Преподаватель: ${book.author}</div>

        <h2 style="font-size: 15px; font-weight: 600; margin-bottom: 12px;">Содержание курса</h2>
        ${bookLessons.length === 0 ? `<div class="empty-state">Список уроков пуст.</div>` : `
          <table class="table">
            <thead>
              <tr><th>№</th><th>Тема урока</th><th>Формат</th></tr>
            </thead>
            <tbody>
              ${bookLessons.map((l, idx) => `
                <tr style="cursor: pointer;" onclick="navigate('lesson', { lessonId: ${l.id} })">
                  <td>${idx + 1}</td>
                  <td style="font-weight: 500;">${l.title}</td>
                  <td>Видео / Аудио</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `}
      `;
    }

    function renderLessonPage() {
      const lesson = state.lessons.find(l => l.id === Number(state.selectedLessonId));
      if (!lesson) return `<div class="container"><button class="btn-outline" onclick="navigate('home')">Назад</button><div class="empty-state" style="margin-top:16px;">Урок не найден</div></div>`;
      const activeVideoUrl = state.videoMode === 'sub' ? lesson.video_sub_url : lesson.video_voice_url;

      return `
        <div style="margin-bottom: 16px;"><button class="btn-outline" onclick="navigate('book', { bookId: ${lesson.book_id} })">Назад к курсу</button></div>
        <h1 class="page-title">${lesson.title}</h1>

        <div class="card" style="margin-bottom: 16px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <span style="font-weight: 600;">Видеоматериал</span>
            <div>
              <button class="btn-outline" style="${state.videoMode === 'sub' ? 'background: var(--bg-subtle);' : ''}" onclick="switchVideoMode('sub')">Субтитры</button>
              <button class="btn-outline" style="${state.videoMode === 'voice' ? 'background: var(--bg-subtle);' : ''}" onclick="switchVideoMode('voice')">Озвучка</button>
            </div>
          </div>
          <div style="background: #000; border-radius: var(--radius); overflow: hidden; aspect-ratio: 16/9;">
            <video controls style="width: 100%; height: 100%; display: block;" src="${activeVideoUrl || ''}"></video>
          </div>
        </div>

        ${lesson.audio_url ? `
          <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
              <span style="font-weight: 600;">Аудиодорожка</span>
              <a href="${lesson.audio_url}" download class="btn-outline" style="text-decoration: none;">Скачать файл</a>
            </div>
            <audio controls style="width: 100%;" src="${lesson.audio_url}"></audio>
          </div>
        ` : ''}
      `;
    }

    function switchVideoMode(mode) {
      state.videoMode = mode;
      render();
    }

    function renderSchedule() { return `<h1 class="page-title">Расписание</h1><div class="empty-state">Нет запланированных занятий.</div>`; }
    function renderExams() { return `<h1 class="page-title">Экзамены</h1><div class="empty-state">Нет активных аттестаций.</div>`; }
    function renderCerts() { return `<h1 class="page-title">Сертификаты</h1><div class="empty-state">Документы об окончании отсутствуют.</div>`; }

    function renderAdmin() {
      return `
        <h1 class="page-title">Панель администрирования</h1>
        <div class="grid-2">
          <div class="card">
            <div class="card-title" style="margin-bottom: 12px;">Добавление дисциплины</div>
            <div class="form-group"><label>Название</label><input type="text" id="adm-book-title" class="form-control" /></div>
            <div class="form-group"><label>Преподаватель</label><input type="text" id="adm-book-author" class="form-control" /></div>
            <div class="form-group"><label>Программа</label><select id="adm-book-prog" class="form-control"><option value="prep">Подготовительный</option><option value="tajweed">Таджвид</option></select></div>
            <div class="form-group"><label>Семестр</label><input type="number" id="adm-book-sem" class="form-control" value="1" /></div>
            <button class="btn-system" style="width: 100%; margin-top: 4px;" onclick="saveBookFromAdmin()">Создать дисциплину</button>
          </div>

          <div class="card">
            <div class="card-title" style="margin-bottom: 12px;">Добавление урока</div>
            <div class="form-group"><label>Дисциплина</label><select id="adm-lesson-book" class="form-control">${state.books.map(b => `<option value="${b.id}">${b.title}</option>`).join('')}</select></div>
            <div class="form-group"><label>Тема урока</label><input type="text" id="adm-lesson-title" class="form-control" /></div>
            <div class="form-group"><label>Ссылка на видео (Субтитры)</label><input type="text" id="adm-video-sub" class="form-control" /></div>
            <div class="form-group"><label>Ссылка на видео (Озвучка)</label><input type="text" id="adm-video-voice" class="form-control" /></div>
            <div class="form-group"><label>Ссылка на аудио</label><input type="text" id="adm-audio-url" class="form-control" /></div>
            <button class="btn-system" style="width: 100%; margin-top: 4px;" onclick="saveLessonFromAdmin()">Сохранить урок</button>
          </div>
        </div>
      `;
    }

    function saveBookFromAdmin() {
      const title = document.getElementById('adm-book-title')?.value.trim();
      const author = document.getElementById('adm-book-author')?.value.trim();
      const program = document.getElementById('adm-book-prog')?.value;
      const semester = Number(document.getElementById('adm-book-sem')?.value) || 1;
      if (!title) return alert('Укажите название');

      state.books.push({ id: Date.now(), title, author: author || 'Преподаватель', program, semester });
      render();
      alert('Дисциплина успешно добавлена.');
    }

    function saveLessonFromAdmin() {
      const book_id = Number(document.getElementById('adm-lesson-book')?.value);
      const title = document.getElementById('adm-lesson-title')?.value.trim();
      const video_sub_url = document.getElementById('adm-video-sub')?.value.trim();
      const video_voice_url = document.getElementById('adm-video-voice')?.value.trim();
      const audio_url = document.getElementById('adm-audio-url')?.value.trim();
      if (!book_id || !title) return alert('Заполните обязательные поля');

      state.lessons.push({ id: Date.now(), book_id, title, video_sub_url, video_voice_url, audio_url });
      render();
      alert('Урок успешно добавлен.');
    }

    render();
  </script>
</body>
</html>
