<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rauda Ilm — Онлайн-школа</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #121312;
      --bg-header: #1c1d1c;
      --bg-card: #222422;
      --bg-card-hover: #292c29;
      --bg-input: #2b2d2b;
      --bg-pill-active: #27382b;
      --border-color: #323532;
      --border-green: #2c5938;
      --text-main: #ffffff;
      --text-muted: #8e938e;
      --accent-lime: #b5d334;
      --accent-green: #249f59;
      --accent-green-hover: #2bb566;
      --accent-green-dark: #193824;
      --danger: #e53935;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    /* ВЕРХНЯЯ ШАПКА ОНЛАЙН-ШКОЛЫ */
    .navbar {
      background-color: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
      padding: 0 24px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar-inner {
      max-width: 1180px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      cursor: pointer;
      user-select: none;
    }

    .brand-logo-box {
      border: 2px solid var(--accent-lime);
      border-radius: 6px;
      padding: 3px 10px;
      color: var(--accent-lime);
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 1.5px;
      line-height: 1.1;
    }

    .brand-sub {
      font-size: 9px;
      color: var(--accent-lime);
      letter-spacing: 1.8px;
      margin-top: 3px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 22px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .nav-links::-webkit-scrollbar { display: none; }

    .nav-item {
      color: var(--text-main);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      position: relative;
      padding: 6px 0;
      transition: color 0.2s;
    }

    .nav-item:hover,
    .nav-item.active {
      color: var(--accent-lime);
    }

    .nav-badge {
      background: #ef4444;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 10px;
      position: relative;
      top: -8px;
      margin-left: 2px;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lang-pill {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .icon-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--accent-green-dark);
      border: 1px solid var(--border-green);
      color: var(--accent-lime);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.2s;
    }

    .icon-circle:hover,
    .icon-circle.active {
      background: var(--accent-green);
      color: var(--accent-lime);
      border-color: var(--accent-lime);
    }

    /* ОСНОВНОЙ КОНТЕЙНЕР */
    .container {
      max-width: 1060px;
      margin: 0 auto;
      padding: 36px 20px 80px;
    }

    .page-title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }

    /* ТАБЫ ПРОГРАММ И СЕМЕСТРОВ */
    .pills-bar {
      display: inline-flex;
      align-items: center;
      background: var(--bg-card);
      padding: 5px;
      border-radius: 12px;
      margin-bottom: 14px;
      gap: 4px;
      flex-wrap: wrap;
    }

    .pill-label {
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }

    .pill-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      font-family: inherit;
    }

    .pill-btn:hover:not(:disabled) {
      color: var(--text-main);
    }

    .pill-btn.active {
      background: var(--bg-pill-active);
      color: var(--text-main);
      font-weight: 600;
    }

    .pill-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .tag-current {
      background: var(--accent-lime);
      color: #121312;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 5px;
    }

    /* СТАТИСТИКА */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin: 22px 0 36px;
    }

    .stat-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 22px 24px;
      display: flex;
      align-items: center;
      gap: 18px;
      min-height: 108px;
    }

    .stat-card.col-layout {
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 12px;
    }

    .stat-big-num {
      font-size: 32px;
      font-weight: 800;
      color: var(--accent-lime);
      line-height: 1;
    }

    .stat-title {
      font-size: 13px;
      color: var(--text-muted);
    }

    .stat-title strong {
      font-size: 22px;
      color: var(--text-main);
      margin-right: 4px;
    }

    .progress-line {
      width: 100%;
      height: 8px;
      background: #333826;
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent-lime);
      border-radius: 99px;
      transition: width 0.4s ease;
    }

    /* КРУГОВОЙ ПРОГРЕСС SVG */
    .circle-wrap {
      position: relative;
      width: 58px;
      height: 58px;
      flex-shrink: 0;
    }

    .circle-wrap.large {
      width: 120px;
      height: 120px;
      margin: 0 auto 14px;
    }

    .circle-svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }

    .circle-bg {
      fill: none;
      stroke: #333826;
      stroke-width: 4;
    }

    .circle-bar {
      fill: none;
      stroke: var(--accent-lime);
      stroke-width: 4;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.5s ease;
    }

    .circle-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
    }

    .circle-wrap.large .circle-text {
      font-size: 22px;
    }

    /* КАРТОЧКИ КНИГ (КУРСОВ ОНЛАЙН-ШКОЛЫ) */
    .section-heading {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .section-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    .books-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .book-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      gap: 18px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: transform 0.15s, border-color 0.2s, background 0.2s;
    }

    .book-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-green);
      transform: translateY(-2px);
    }

    .book-cover {
      width: 96px;
      height: 136px;
      border-radius: 10px;
      background: linear-gradient(135deg, #f3f4f0 0%, #dcded6 100%);
      flex-shrink: 0;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 14px solid var(--accent-lime);
      color: #1b1d1b;
      box-shadow: 0 6px 16px rgba(0,0,0,0.35);
      overflow: hidden;
      position: relative;
    }

    .book-cover img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .book-cover-title {
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      line-height: 1.25;
      word-break: break-word;
    }

    .book-cover-author {
      font-size: 7px;
      color: #555;
      font-weight: 600;
    }

    .book-info {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
    }

    .book-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.35;
    }

    .book-author {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .book-badges {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .badge-green {
      background: var(--accent-green);
      color: #fff;
    }

    .badge-dark {
      background: #2c2f2c;
      color: var(--text-muted);
    }

    .badge-outline-green {
      background: rgba(36, 159, 89, 0.15);
      color: #38c172;
      border: 1px solid rgba(56, 193, 114, 0.3);
      text-decoration: none;
      cursor: pointer;
    }

    /* СТРАНИЦА ПРОФИЛЯ (ТОЧНО ПО СКРИНШОТАМ) */
    .profile-tabs-header {
      display: flex;
      align-items: baseline;
      gap: 22px;
      margin-bottom: 26px;
    }

    .profile-tab-title {
      font-size: 28px;
      font-weight: 700;
      color: #6c706c;
      cursor: pointer;
      transition: color 0.2s;
      user-select: none;
    }

    .profile-tab-title.active {
      color: #ffffff;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: start;
    }

    .profile-col {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .profile-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 24px;
    }

    .profile-card-heading {
      font-size: 16px;
      font-weight: 600;
      color: #38c172;
      margin-bottom: 16px;
    }

    .profile-field-group {
      margin-bottom: 16px;
    }
    .profile-field-group:last-child {
      margin-bottom: 0;
    }

    .profile-field-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .profile-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .profile-input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid #3a3d3a;
      color: #ffffff;
      padding: 13px 42px 13px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    .profile-input:focus {
      outline: none;
      border-color: #38c172;
    }

    .profile-input-icon {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .profile-input-icon:hover {
      color: #fff;
    }

    .btn-green {
      background: var(--accent-green);
      color: #ffffff;
      border: none;
      padding: 11px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: inherit;
      transition: background 0.2s;
    }

    .btn-green:hover {
      background: var(--accent-green-hover);
    }

    .btn-outline-red {
      background: transparent;
      color: var(--danger);
      border: 1px solid rgba(229, 57, 53, 0.55);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: inherit;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn-outline-red:hover {
      background: rgba(229, 57, 53, 0.1);
      border-color: var(--danger);
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      user-select: none;
    }
    .check-row:last-child {
      margin-bottom: 0;
    }

    .check-row input {
      display: none;
    }

    .custom-check {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 1.5px solid #6c706c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: transparent;
      transition: all 0.15s;
    }

    .check-row input:checked + .custom-check {
      background: #2ebd6b;
      border-color: #2ebd6b;
      color: #ffffff;
    }

    /* СТРАНИЦА КНИГИ И УРОКОВ */
    .back-btn {
      background: var(--bg-card);
      color: var(--text-muted);
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: color 0.2s, background 0.2s;
      font-family: inherit;
    }

    .back-btn:hover {
      color: #fff;
      background: var(--bg-card-hover);
    }

    .book-detail-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    .lesson-row {
      background: var(--bg-card);
      border-radius: var(--radius-md);
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.2s, border-color 0.2s;
    }

    .lesson-row:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-green);
    }

    .lesson-row-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .lesson-row-sub {
      display: inline-block;
      background: #2b2e2b;
      color: var(--text-muted);
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 6px;
    }

    .check-box {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: #2b2e2b;
      display: flex;
      align-items: center;
      justify-content: center;
      color: transparent;
      font-size: 13px;
      font-weight: 800;
    }

    .check-box.done {
      background: rgba(36, 159, 89, 0.2);
      color: #38c172;
      border: 1px solid rgba(56, 193, 114, 0.4);
    }

    /* СТРАНИЦА УРОКА И ДВОЙНОГО ПЛЕЕРА */
    .lesson-page-grid {
      display: grid;
      grid-template-columns: 230px 1fr;
      gap: 22px;
      align-items: start;
    }

    .structure-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 18px;
    }

    .structure-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .structure-btn {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-main);
      padding: 11px 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      margin-bottom: 6px;
      font-family: inherit;
      transition: background 0.2s;
    }

    .structure-btn.active {
      background: var(--bg-pill-active);
      font-weight: 600;
    }

    .quiz-pill {
      background: var(--accent-green);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
    }

    .lesson-header-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 22px 26px;
      margin-bottom: 18px;
    }

    .lesson-header-card h2 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .lesson-header-card p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .lesson-header-card p span {
      color: #38c172;
      font-weight: 600;
    }

    /* КАРТОЧКА ДВОЙНОГО ВИДЕОПЛЕЕРА */
    .player-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 20px 24px 24px;
      margin-bottom: 18px;
    }

    .player-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .player-topbar-title {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mode-switch {
      background: #161816;
      padding: 4px;
      border-radius: 10px;
      display: inline-flex;
      gap: 4px;
      border: 1px solid var(--border-color);
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 7px 16px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .mode-btn.active {
      background: #272a27;
      color: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .video-viewport {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #0d0e0d;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--border-color);
    }

    .video-viewport video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .video-mode-indicator {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(18, 19, 18, 0.82);
      border: 1px solid var(--border-green);
      color: var(--accent-lime);
      padding: 5px 11px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      pointer-events: none;
      backdrop-filter: blur(6px);
    }

    /* ОТДЕЛЬНЫЙ АУДИОПЛЕЕР НИЖЕ */
    .audio-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      margin-bottom: 18px;
      border: 1px solid var(--border-color);
    }

    .audio-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .audio-player-custom {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #171917;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #2a2e2a;
    }

    .play-circle-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--accent-green);
      color: #fff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s, background 0.2s;
    }

    .play-circle-btn:hover {
      background: var(--accent-green-hover);
      transform: scale(1.04);
    }

    .audio-timeline {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

      color: #38c172;
      font-weight: 600;

      border: 1px solid var(--border-color);

      padding: 8px;

      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;

    .admin-box {

    .form-group {

    .form-group label {

      font-size: 12px;

      font-family: inherit;

    .form-input:focus, .form-select:focus, .form-textarea:focus {

    .upload-inline {

      await syncProfileWithWorker();

      const newEmail = document.getElementById('prof-new-email')?.value.trim();

      await syncProfileWithWorker();
      render();
      alert('Email успешно обновлен!');

      state.user[key] = val;

    function switchVideoMode(mode) {
      if (state.videoMode === mode) return;
      const lesson = state.lessons.find(l => l.id === Number(state.selectedLessonId)) || state.lessons[0];
      const videoEl = document.getElementById('dual-video-player');

      let savedTime = 0;
      let wasPlaying = false;
      if (videoEl) {
        savedTime = videoEl.currentTime || 0;
        wasPlaying = !videoEl.paused;
      }

      state.videoMode = mode;
      const nextUrl = mode === 'sub' ? lesson.video_sub_url : lesson.video_voice_url;

      if (videoEl) {
        videoEl.src = nextUrl || '';
        videoEl.addEventListener('loadedmetadata', function restorePos() {
          if (savedTime > 0 && savedTime < videoEl.duration) {
            videoEl.currentTime = savedTime;
          }
          if (wasPlaying) videoEl.play().catch(() => {});
          videoEl.removeEventListener('loadedmetadata', restorePos);
        });
      }

      document.getElementById('btn-mode-sub')?.classList.toggle('active', mode === 'sub');
      document.getElementById('btn-mode-voice')?.classList.toggle('active', mode === 'voice');
      const badge = document.getElementById('video-mode-badge');
      if (badge) badge.textContent = `Режим: ${mode === 'sub' ? 'Субтитры' : 'Озвучка'}`;
    }

    function initLessonMediaPlayers() {
      const audio = document.getElementById('separate-audio-element');
      const seek = document.getElementById('audio-seek');
      const curTime = document.getElementById('audio-cur-time');
      const durTime = document.getElementById('audio-dur-time');
      const playBtn = document.getElementById('audio-play-btn');

      if (!audio || !seek) return;

      const fmt = (sec) => {
        if (!sec || isNaN(sec)) return '00:00';
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      };

      audio.addEventListener('loadedmetadata', () => {
        durTime.textContent = fmt(audio.duration);
      });

      audio.addEventListener('timeupdate', () => {
        if (audio.duration) {
          seek.value = (audio.currentTime / audio.duration) * 100;
          curTime.textContent = fmt(audio.currentTime);
        }
      });

      audio.addEventListener('ended', () => {
        playBtn.textContent = '▶';
      });

      seek.addEventListener('input', () => {
        if (audio.duration) {
          audio.currentTime = (seek.value / 100) * audio.duration;
        }
      });
    }

    function toggleSeparateAudio() {
      const audio = document.getElementById('separate-audio-element');
      const playBtn = document.getElementById('audio-play-btn');
      const video = document.getElementById('dual-video-player');
      if (!audio) return;

      if (audio.paused) {
        if (video && !video.paused) video.pause();
        audio.play();
        playBtn.textContent = '⏸';
      } else {
        audio.pause();
        playBtn.textContent = '▶';
      }
    }

    function cycleAudioSpeed() {
      const audio = document.getElementById('separate-audio-element');
      const btn = document.getElementById('audio-speed-btn');
      if (!audio || !btn) return;
      const speeds = [1, 1.25, 1.5, 2];
      const next = speeds[(speeds.indexOf(audio.playbackRate) + 1) % speeds.length];
      audio.playbackRate = next;
      btn.textContent = `${next}x`;
    }

            <button class="btn-green">Начать экзамен</button>
          </div>
        </div>

        <h2 class="section-heading" style="margin-bottom: 16px;">Сданные экзамены</h2>
        <div class="admin-box" style="max-width: 520px;">
          <div style="font-size: 17px; font-weight: 700; margin-bottom: 12px;">
            Ясные заветы относительно извлечения пользы из научных уроков
          </div>
          <div style="display: flex; gap: 10px; margin-bottom: 16px;">
            <span class="badge badge-dark">📅 Сдан: 17 октября в 12:21</span>
            <span class="badge badge-green">🏆 81%</span>
          </div>
          <button class="btn-green" style="width: 100%; justify-content: center; background: #e6ece8; color: #198754;">
            Посмотреть результаты
          </button>
        </div>
      `;
    }

    function renderCerts() {
      return `
        <h1 class="page-title">Сертификаты онлайн-школы</h1>
        <div class="books-grid">
          <div class="admin-box">
            <div style="font-size: 17px; font-weight: 700; margin-bottom: 6px;">
              Ясные заветы относительно извлечения пользы из научных уроков
            </div>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">
              Свидетельствует администрация онлайн-школы «Рауда Ильм», что ученик ${state.user.lastName} ${state.user.firstName} успешно сдал экзамен по книге.
            </p>
            <span class="badge badge-green">✓ Подтвержден (81%)</span>
          </div>
        </div>
      `;
    }

    function renderAdmin() {
      return `
        <h1 class="page-title">⚙️ Управление онлайн-школой (Админ-панель)</h1>

        <div class="admin-grid">
          <div class="admin-box">
            <h3 style="margin-bottom: 16px; font-size: 18px;">Добавить / Обновить урок</h3>

            <div class="form-group">
              <label>Выберите книгу (курс)</label>
              <select id="adm-book-id" class="form-select">
                ${state.books.map(b => `<option value="${b.id}">${b.title}</option>`).join('')}
              </select>
            </div>

            <div style="display: grid; grid-template-columns: 110px 1fr; gap: 12px;">
              <div class="form-group">
                <label>Номер урока</label>
                <input type="number" id="adm-lesson-num" class="form-input" value="${state.lessons.length + 1}" />
              </div>
              <div class="form-group">
                <label>Название урока</label>
                <input type="text" id="adm-lesson-title" class="form-input" placeholder="Например: 5 урок" />
              </div>
            </div>

            <div class="form-group">
              <label>1️⃣ Видео с СУБТИТРАМИ (URL или загрузка в R2)</label>
              <div class="upload-inline">
                <input type="text" id="adm-video-sub" class="form-input" placeholder="https://.../video_sub.mp4" />
                <label class="btn-upload">
                  Загрузить R2
                  <input type="file" accept="video/*" style="display:none" onchange="uploadMediaToR2(this, 'adm-video-sub')" />
                </label>
              </div>
            </div>

            <div class="form-group">
              <label>2️⃣ Видео с ОЗВУЧКОЙ (URL или загрузка в R2)</label>
              <div class="upload-inline">
                <input type="text" id="adm-video-voice" class="form-input" placeholder="https://.../video_voice.mp4" />
                <label class="btn-upload">
                  Загрузить R2
                  <input type="file" accept="video/*" style="display:none" onchange="uploadMediaToR2(this, 'adm-video-voice')" />
                </label>
              </div>
            </div>

            <div class="form-group">
              <label>3️⃣ Отдельный АУДИОФАЙЛ ниже плеера (MP3/M4A)</label>
              <div class="upload-inline">
                <input type="text" id="adm-audio-url" class="form-input" placeholder="https://.../audio.mp3" />
                <label class="btn-upload">
                  Загрузить R2
                  <input type="file" accept="audio/*" style="display:none" onchange="uploadMediaToR2(this, 'adm-audio-url')" />
                </label>
              </div>
            </div>

            <div class="form-group">
              <label>Вопросы викторины (JSON формат)</label>
              <textarea id="adm-quiz-json" class="form-textarea" rows="4">[
  {
    "q": "Вопрос №1. В какой мечети проводился семинар?",
    "options": ["в мечети ибн Таймийи", "в мечети Усмана", "в мечети абу Бакра"],
    "correct": 0
  }
]</textarea>
            </div>

            <button class="btn-green" style="width: 100%; justify-content: center;" onclick="saveLessonFromAdmin()">
              💾 Сохранить урок
            </button>
          </div>

          <div>
            <div class="admin-box" style="margin-bottom: 20px;">
              <h3 style="margin-bottom: 16px; font-size: 18px;">Добавить новую книгу (курс)</h3>
              <div class="form-group">
                <label>Название книги</label>
                <input type="text" id="adm-book-title" class="form-input" placeholder="Разъяснение 3 основ" />
              </div>
              <div class="form-group">
                <label>Автор / Преподаватель</label>
                <input type="text" id="adm-book-author" class="form-input" placeholder="Шейх Салих аль-Усайми" />
              </div>
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div class="form-group">
                  <label>Программа</label>
                  <select id="adm-book-prog" class="form-select">
                    <option value="prep">Подготовительный</option>
                    <option value="tajweed">Таджвид</option>
                  </select>
                </div>
                <div class="form-group">
                  <label>Семестр</label>
                  <input type="number" id="adm-book-sem" class="form-input" value="1" />
                </div>
              </div>
              <button class="btn-green" style="width: 100%; justify-content: center;" onclick="saveBookFromAdmin()">
                ➕ Создать книгу
              </button>
            </div>

            <div class="admin-box">
              <h3 style="margin-bottom: 12px; font-size: 16px;">Быстрый переход к редактированию уроков</h3>
              ${state.lessons.map(l => `
                <div style="display:flex; justify-content:space-between; align-items:center; padding: 10px 0; border-bottom: 1px solid var(--border-color); font-size: 13px;">
                  <div>
                    <strong>${l.title}</strong> (Книга #${l.book_id})
                    <div style="color: var(--text-muted); font-size: 11px;">
                      Субтитры: ${l.video_sub_url ? '✅' : '❌'} | Озвучка: ${l.video_voice_url ? '✅' : '❌'} | Аудио: ${l.audio_url ? '✅' : '❌'}
                    </div>
                  </div>
                  <button class="speed-btn" onclick="fillLessonForm(${l.id})">Изменить</button>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function fillLessonForm(lessonId) {
      const l = state.lessons.find(item => item.id === lessonId);
      if (!l) return;
      document.getElementById('adm-book-id').value = l.book_id;
      document.getElementById('adm-lesson-num').value = l.lesson_number;
      document.getElementById('adm-lesson-title').value = l.title;
      document.getElementById('adm-video-sub').value = l.video_sub_url || '';
      document.getElementById('adm-video-voice').value = l.video_voice_url || '';
      document.getElementById('adm-audio-url').value = l.audio_url || '';
      document.getElementById('adm-quiz-json').value = JSON.stringify(l.quiz || [], null, 2);
    }

    async function uploadMediaToR2(inputEl, targetInputId) {
      const file = inputEl.files[0];
      if (!file) return;
      const target = document.getElementById(targetInputId);

      if (!API_BASE_URL) {
        target.value = URL.createObjectURL(file);
        alert(`Файл "${file.name}" подключен для предпросмотра!`);
        return;
      }

      try {
        target.value = "Загрузка в R2...";
        const res = await fetch(`${API_BASE_URL}/api/admin/upload?filename=${encodeURIComponent(file.name)}`, {
          method: 'PUT',
          headers: { 'Content-Type': file.type },
          body: file
        });
        const data = await res.json();
        target.value = data.url || '';
      } catch (e) {
        alert('Ошибка загрузки файла: ' + e.message);
      }
    }

    async function saveLessonFromAdmin() {
      const book_id = Number(document.getElementById('adm-book-id').value);
      const lesson_number = Number(document.getElementById('adm-lesson-num').value);
      const title = document.getElementById('adm-lesson-title').value.trim() || `${lesson_number} урок`;
      const video_sub_url = document.getElementById('adm-video-sub').value.trim();
      const video_voice_url = document.getElementById('adm-video-voice').value.trim();
      const audio_url = document.getElementById('adm-audio-url').value.trim();

      let quiz = [];
      try {
        quiz = JSON.parse(document.getElementById('adm-quiz-json').value);
      } catch (e) {
        alert('Ошибка в JSON викторины. Проверьте синтаксис.');
        return;
      }

      const existing = state.lessons.find(l => l.book_id === book_id && l.lesson_number === lesson_number);
      if (existing) {
        Object.assign(existing, { title, video_sub_url, video_voice_url, audio_url, quiz });
      } else {
        state.lessons.push({
          id: Date.now(),
          book_id,
          lesson_number,
          title,
          video_sub_url,
          video_voice_url,
          audio_url,
          completed: false,
          quiz_score: quiz.length,
          quiz_total: quiz.length,
          quiz
        });
      }

      if (API_BASE_URL) {
        await fetch(`${API_BASE_URL}/api/admin/lesson`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ book_id, lesson_number, title, video_sub_url, video_voice_url, audio_url, quiz_json: quiz })
        }).catch(() => {});
      }

      alert('Урок успешно сохранен!');
      navigate('lesson', { lessonId: existing ? existing.id : state.lessons[state.lessons.length - 1].id, lessonTab: 'lesson' });
    }

    async function saveBookFromAdmin() {
      const title = document.getElementById('adm-book-title').value.trim();
      const author = document.getElementById('adm-book-author').value.trim();
      const program = document.getElementById('adm-book-prog').value;
      const semester = Number(document.getElementById('adm-book-sem').value) || 1;

      if (!title) return alert('Введите название книги');

      const newBook = {
        id: Date.now(),
        title,
        author: author || 'Шейх',
        program,
        semester,
        completed: false
      };
      state.books.push(newBook);

      if (API_BASE_URL) {
        await fetch(`${API_BASE_URL}/api/admin/book`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newBook)
        }).catch(() => {});
      }

      render();
      alert('Книга добавлена!');
    }

    render();
  </script>
</body>
</html>
