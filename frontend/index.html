<!DOCTYPE html><html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>RAUDA ILM</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        background: #f5f7fb;
        color: #172033;
    }

    button,
    input {
        font: inherit;
    }

    button {
        cursor: pointer;
    }

    .app {
        min-height: 100vh;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 18px;
        background: white;
        border-bottom: 1px solid #e8ebf1;
        position: sticky;
        top: 0;
        z-index: 50;
    }

    .logo {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: .5px;
    }

    .menu-button {
    width: 44px;
    height: 44px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 0;
    line-height: 1;
    text-align: center;

    border: 0;
    border-radius: 12px;
    background: #f0f2f6;
    font-size: 23px;
}

    /* =========================
       CONTENT
    ========================= */

    .content {
        max-width: 900px;
        margin: 0 auto;
        padding: 22px 16px 40px;
    }

    .screen {
        display: none;
    }

    .screen.active {
        display: block;
    }

    .welcome {
        margin-bottom: 20px;
    }

    .welcome-small {
        color: #697386;
        font-size: 14px;
        margin-bottom: 4px;
    }

    .welcome-title {
        font-size: 27px;
        font-weight: 800;
        margin: 0;
    }

    /* =========================
       CARDS
    ========================= */

    .card {
        background: white;
        border-radius: 18px;
        padding: 20px;
        margin-bottom: 16px;
        border: 1px solid #e9edf3;
        box-shadow: 0 4px 18px rgba(20, 30, 50, .04);
    }

    .program-label {
        color: #737d90;
        font-size: 13px;
        margin-bottom: 8px;
    }

    .program-title {
        font-size: 22px;
        font-weight: 750;
        margin-bottom: 10px;
    }

    .program-description {
        color: #687386;
        line-height: 1.5;
        font-size: 14px;
    }

    .semester {
        display: inline-block;
        margin-top: 14px;
        padding: 8px 12px;
        border-radius: 10px;
        background: #f0f3f8;
        font-size: 13px;
        font-weight: 600;
    }

    /* =========================
       BUTTONS
    ========================= */

    .primary-button {
        width: 100%;
        border: 0;
        border-radius: 13px;
        padding: 14px 16px;
        background: #172033;
        color: white;
        font-weight: 700;
        margin-top: 12px;
    }

    .secondary-button {
        width: 100%;
        border: 1px solid #dfe4ec;
        border-radius: 13px;
        padding: 13px 16px;
        background: white;
        color: #172033;
        font-weight: 650;
        margin-top: 10px;
    }

    .admin-link {
        display: block;
        width: 100%;
        margin-top: 10px;
        padding: 13px 16px;
        color: #172033;
        border: 1px solid #dfe4ec;
        border-radius: 13px;
        background: #f8fafc;
        text-align: center;
        text-decoration: none;
        font-weight: 700;
    }

    .admin-link:active {
        background: #eef2f7;
    }

    /* =========================
       PROFILE
    ========================= */

    .back-button {
        border: 0;
        background: transparent;
        padding: 4px 0 18px;
        color: #58647a;
        font-weight: 650;
    }

    .profile-header {
        text-align: center;
        padding: 15px 0 25px;
    }

    .avatar {
        width: 82px;
        height: 82px;
        margin: 0 auto 14px;
        border-radius: 50%;
        background: #172033;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: 800;
    }

    .profile-name {
        font-size: 23px;
        font-weight: 800;
    }

    .profile-role {
        color: #707b8f;
        margin-top: 5px;
        font-size: 14px;
    }

    .profile-row {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        padding: 14px 0;
        border-bottom: 1px solid #edf0f4;
    }

    .profile-row:last-child {
        border-bottom: 0;
    }

    .profile-row span:first-child {
        color: #788296;
    }

    .profile-row span:last-child {
        font-weight: 650;
        text-align: right;
        word-break: break-word;
    }

    /* =========================
       LESSONS
    ========================= */

    .lesson {
        padding: 16px 0;
        border-bottom: 1px solid #edf0f4;
    }

    .lesson:last-child {
        border-bottom: 0;
    }

    .lesson-title {
        font-size: 16px;
        font-weight: 750;
    }

    .lesson-description {
        margin-top: 6px;
        color: #707b8f;
        font-size: 14px;
        line-height: 1.45;
    }

    .completed {
        color: #17864b;
        font-size: 13px;
        font-weight: 700;
        margin-top: 8px;
    }

    /* =========================
       MENU
    ========================= */

    .menu-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.35);
        z-index: 100;
    }

    .menu-overlay.active {
        display: block;
    }

    .side-menu {
        position: fixed;
        top: 0;
        right: -330px;
        width: min(330px, 88vw);
        height: 100vh;
        background: white;
        z-index: 110;
        padding: 22px 16px;
        transition: right .25s ease;
        box-shadow: -8px 0 30px rgba(0,0,0,.12);
    }

    .side-menu.active {
        right: 0;
    }

    .menu-title {
        font-size: 22px;
        font-weight: 800;
        margin: 5px 8px 20px;
    }

    .menu-item {
        width: 100%;
        border: 0;
        background: transparent;
        text-align: left;
        padding: 15px 12px;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 650;
        margin-bottom: 4px;
    }

    .menu-item:active {
        background: #f1f3f7;
    }

    .menu-close {
        position: absolute;
        top: 18px;
        right: 15px;
        border: 0;
        background: #f0f2f6;
        border-radius: 10px;
        width: 38px;
        height: 38px;
        font-size: 20px;
    }

    /* =========================
       AUTH
    ========================= */

    .auth-screen {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .auth-card {
        width: 100%;
        max-width: 430px;
        background: white;
        border-radius: 22px;
        padding: 25px;
        box-shadow: 0 10px 40px rgba(20,30,50,.08);
        border: 1px solid #e8ebf1;
    }

    .auth-logo {
        text-align: center;
        font-size: 30px;
        font-weight: 900;
        margin-bottom: 8px;
    }

    .auth-subtitle {
        text-align: center;
        color: #788296;
        font-size: 14px;
        margin-bottom: 25px;
    }

    .input {
        width: 100%;
        border: 1px solid #dce1e9;
        border-radius: 12px;
        padding: 13px 14px;
        outline: none;
        margin-bottom: 10px;
        background: #fafbfc;
    }

    .input:focus {
        border-color: #8792a7;
        background: white;
    }

    .auth-switch {
        text-align: center;
        color: #687386;
        font-size: 14px;
        margin-top: 18px;
    }

    .auth-switch button {
        border: 0;
        background: none;
        font-weight: 750;
        color: #172033;
    }

    .error {
        display: none;
        padding: 11px 12px;
        border-radius: 10px;
        background: #fff0f0;
        color: #b42318;
        font-size: 13px;
        margin-bottom: 12px;
    }

    .error.show {
        display: block;
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
        text-align: center;
        color: #778196;
        padding: 30px 10px;
    }

    .empty {
        text-align: center;
        color: #788296;
        padding: 25px 10px;
    }

    @media (min-width: 700px) {
        .content {
            padding-top: 35px;
        }
    }

/* RAUDA UI POLISH */

body {
    background:
        radial-gradient(circle at 20% 0%, rgba(23,32,51,.055), transparent 30%),
        #f5f7fb;
}

.auth-screen {
    background:
        radial-gradient(circle at 50% -10%, rgba(23,32,51,.09), transparent 38%),
        linear-gradient(180deg, #f7f9fc 0%, #f2f5f9 100%);
}

.auth-card {
    max-width: 440px;
    padding: 30px;
    border-radius: 24px;
    border: 1px solid #e4e8ef;
    box-shadow:
        0 22px 60px rgba(23,32,51,.10),
        0 2px 8px rgba(23,32,51,.04);
}

.auth-logo {
    letter-spacing: 1px;
    font-size: 29px;
}

.auth-subtitle {
    margin-bottom: 28px;
}

.input {
    min-height: 50px;
    padding: 14px 15px;
    border-radius: 13px;
    border: 1px solid #d9dfe8;
    background: #f8fafc;
    transition:
        border-color .16s ease,
        box-shadow .16s ease,
        background .16s ease,
        transform .12s ease;
}

.input:hover {
    border-color: #c3cbd7;
    background: #fff;
}

.input:focus {
    border-color: #6f7c91;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(23,32,51,.07);
}

button,
.admin-link {
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;

    transition:
        color .15s ease,
        border-color .15s ease;
}

.primary-button {
    min-height: 50px;
    border-radius: 13px;
    box-shadow: 0 7px 16px rgba(23,32,51,.18);
}

.primary-button:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 21px rgba(23,32,51,.22);
}

.primary-button:active {
    transform: none;
    box-shadow: none;
}

.secondary-button {
    min-height: 48px;
    border-color: #d9dfe8;
    background: #f9fafc;
    box-shadow: 0 2px 6px rgba(23,32,51,.035);
}

.secondary-button:hover {
    background: #f1f4f8;
    border-color: #c8d0dc;
    transform: translateY(-1px);
}

.secondary-button:active {
    background: #e9edf3;
    transform: translateY(2px) scale(.985);
    box-shadow: none;
}

.admin-link:hover {
    background: #eef2f7;
    border-color: #c8d0dc;
    transform: translateY(-1px);
}

.admin-link:active {
    transform: translateY(2px) scale(.985);
}

.menu-button:hover,
.menu-item:hover,
.menu-close:hover {
    background: #e7ebf1;
}

.menu-item:active,
.menu-close:active,
.auth-switch button:active {
    transform: translateY(2px) scale(.97);
}

.menu-button:active,
.back-button:active {
    transform: none !important;
    -webkit-transform: none !important;
    box-shadow: none !important;
    filter: none !important;
}
.auth-switch button {
    cursor: pointer;
    padding: 5px 8px;
    border-radius: 8px;
}

.auth-switch button:hover {
    background: #eef2f6;
}

button:focus-visible,
.admin-link:focus-visible {
    outline: 3px solid rgba(23,32,51,.2);
    outline-offset: 2px;
}

button:disabled {
    opacity: .55;
    cursor: wait;
    transform: none !important;
    box-shadow: none !important;
}

#loginForm > div[style*="text-align:center"],
#registerForm > div[style*="text-align:center"] {
    display: flex !important;
    align-items: center;
    gap: 12px;
    font-size: 12px !important;
    text-transform: uppercase;
    letter-spacing: .7px;
    color: #8a94a5 !important;
}

#loginForm > div[style*="text-align:center"]::before,
#loginForm > div[style*="text-align:center"]::after,
#registerForm > div[style*="text-align:center"]::before,
#registerForm > div[style*="text-align:center"]::after {
    content: "";
    height: 1px;
    flex: 1;
    background: #e2e6ec;
}

.error.show {
    animation: raudaErrorIn .18s ease;
}

@keyframes raudaErrorIn {
    from {
        opacity: 0;
        transform: translateY(-4px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 520px) {
    .auth-screen {
        padding: 12px;
        align-items: flex-start;
    }

    .auth-card {
        margin-top: 18px;
        padding: 22px 18px;
        border-radius: 20px;
    }
}



/* RAUDA CALM BUTTON STATES */

.primary-button,
.secondary-button,
.admin-link,
.menu-button,
.menu-item,
.menu-close,
.back-button,
.auth-switch button {
    transform: none !important;
    transition:
        background-color .12s ease,
        border-color .12s ease,
        box-shadow .12s ease,
        opacity .12s ease !important;
}

.primary-button:hover {
    transform: none !important;
}

.primary-button:active {
    transform: none !important;
    background: #0f1728;
    box-shadow:
        inset 0 2px 4px rgba(0,0,0,.16) !important;
}

.secondary-button:hover,
.admin-link:hover {
    transform: none !important;
}

.secondary-button:active,
.admin-link:active {
    transform: none !important;
    background: #e7ebf1;
    border-color: #cbd2dc;
    box-shadow:
        inset 0 2px 4px rgba(23,32,51,.08) !important;
}

.menu-button:active,
.menu-item:active,
.menu-close:active,
.back-button:active,
.auth-switch button:active {
    transform: none !important;
    opacity: .72;
}

.email-status {
    display: none;
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.4;
}

.email-status.show {
    display: block;
}

.email-status.success {
    color: #126c3b;
    background: #edf9f2;
    border: 1px solid #cdebd9;
}

.email-status.error {
    color: #a3261d;
    background: #fff1f0;
    border: 1px solid #f0d0cd;
}

.email-status.loading {
    color: #58647a;
    background: #f1f4f8;
    border: 1px solid #dde3eb;
}


/* RAUDA GOLD GREEN THEME START */

:root {
    --rauda-green: #173d2c;
    --rauda-green-2: #24543d;
    --rauda-green-soft: #e9f0eb;

    --rauda-gold: #c5a25d;
    --rauda-gold-dark: #a98745;
    --rauda-gold-soft: #f1e7cf;

    --rauda-cream: #f7f3e9;
    --rauda-surface: #fffdf8;

    --rauda-text: #1d2b23;
    --rauda-muted: #7a7a6f;
    --rauda-border: #e5dbc4;
}


/* =========================
   ОСНОВА
========================= */

body {
    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(197,162,93,.12),
            transparent 32%
        ),
        radial-gradient(
            circle at 100% 10%,
            rgba(23,61,44,.08),
            transparent 35%
        ),
        var(--rauda-cream) !important;

    color: var(--rauda-text) !important;
}


/* =========================
   HEADER
========================= */

.header {
    background: rgba(255,253,248,.96) !important;
    border-bottom: 1px solid var(--rauda-border) !important;
    box-shadow: 0 3px 18px rgba(23,61,44,.045);
}

.logo,
.auth-logo {
    color: var(--rauda-green) !important;
}

.auth-logo {
    letter-spacing: 1.2px;
}

.auth-logo::after {
    content: "";
    display: block;
    width: 42px;
    height: 3px;
    margin: 10px auto 0;
    border-radius: 999px;

    background:
        linear-gradient(
            90deg,
            var(--rauda-gold-dark),
            var(--rauda-gold)
        );
}


/* =========================
   AUTH
========================= */

.auth-screen {
    background:
        radial-gradient(
            circle at 50% -5%,
            rgba(197,162,93,.17),
            transparent 34%
        ),
        linear-gradient(
            180deg,
            #faf7ef 0%,
            #f4efe4 100%
        ) !important;
}

.auth-card {
    background: rgba(255,253,248,.98) !important;
    border: 1px solid var(--rauda-border) !important;

    box-shadow:
        0 22px 55px rgba(23,61,44,.09),
        0 3px 12px rgba(197,162,93,.08) !important;
}

.auth-subtitle {
    color: var(--rauda-muted) !important;
}


/* =========================
   КАРТОЧКИ
========================= */

.card {
    background: var(--rauda-surface) !important;
    border: 1px solid var(--rauda-border) !important;

    box-shadow:
        0 5px 20px rgba(23,61,44,.045) !important;
}

.program-label,
.welcome-small,
.profile-role,
.lesson-description {
    color: var(--rauda-muted) !important;
}

.program-title,
.welcome-title,
.profile-name,
.lesson-title {
    color: var(--rauda-green) !important;
}

.semester {
    background: var(--rauda-gold-soft) !important;
    color: #725b2e !important;
    border: 1px solid #e3d2aa;
}


/* =========================
   INPUT
========================= */

.input,
input,
textarea,
select {
    background: #fffdf9 !important;
    color: var(--rauda-text) !important;

    border-color:
        var(--rauda-border) !important;
}

.input:hover,
input:hover,
textarea:hover,
select:hover {
    border-color: #d5c399 !important;
}

.input:focus,
input:focus,
textarea:focus,
select:focus {
    border-color:
        var(--rauda-gold-dark) !important;

    background: #ffffff !important;

    box-shadow:
        0 0 0 4px
        rgba(197,162,93,.13) !important;

    outline: none;
}

::placeholder {
    color: #a19c8e !important;
}


/* =========================
   ГЛАВНЫЕ КНОПКИ
========================= */

.primary-button {
    background:
        linear-gradient(
            180deg,
            #214c38 0%,
            var(--rauda-green) 100%
        ) !important;

    color: #fffdf8 !important;

    border:
        1px solid #294f3c !important;

    box-shadow:
        0 5px 13px
        rgba(23,61,44,.18) !important;

    transform: none !important;
}

.primary-button:hover {
    background:
        linear-gradient(
            180deg,
            #295840 0%,
            #1d4633 100%
        ) !important;

    transform: none !important;
}

.primary-button:active {
    background:
        #123324 !important;

    transform: none !important;

    box-shadow:
        inset 0 2px 5px
        rgba(0,0,0,.18) !important;
}


/* =========================
   ВТОРИЧНЫЕ КНОПКИ
========================= */

.secondary-button,
.admin-link {
    background:
        #fbf7ee !important;

    color:
        var(--rauda-green) !important;

    border:
        1px solid #d9c79f !important;

    transform: none !important;
}

.secondary-button:hover,
.admin-link:hover {
    background:
        var(--rauda-gold-soft) !important;

    border-color:
        var(--rauda-gold) !important;

    transform: none !important;
}

.secondary-button:active,
.admin-link:active {
    background:
        #e7d9b9 !important;

    transform: none !important;

    box-shadow:
        inset 0 2px 4px
        rgba(90,70,30,.10) !important;
}


/* =========================
   ВСЕ ОСТАЛЬНЫЕ КНОПКИ
========================= */

button {
    transition:
        background-color .12s ease,
        border-color .12s ease,
        box-shadow .12s ease,
        opacity .12s ease !important;

    transform: none !important;
}

button:active {
    transform: none !important;
}

button:disabled {
    opacity: .55;
    transform: none !important;
}


/* =========================
   MENU
========================= */

.menu-button,
.menu-close {
    background:
        var(--rauda-green-soft) !important;

    color:
        var(--rauda-green) !important;

    border:
        1px solid #d8e2da !important;
}

.menu-button:hover,
.menu-close:hover {
    background:
        #dfe9e2 !important;
}

.menu-item {
    color:
        var(--rauda-green) !important;
}

.menu-item:hover,
.menu-item:active {
    background:
        var(--rauda-green-soft) !important;
}

.side-menu {
    background:
        var(--rauda-surface) !important;

    border-left:
    none !important;
}


/* =========================
   PROFILE
========================= */

.avatar {
    background:
        linear-gradient(
            145deg,
            var(--rauda-green-2),
            var(--rauda-green)
        ) !important;

    border:
        3px solid
        var(--rauda-gold) !important;

    box-shadow:
        0 7px 18px
        rgba(23,61,44,.18);
}

.profile-row {
    border-bottom-color:
        #eee5d3 !important;
}

.profile-row span:first-child {
    color:
        var(--rauda-muted) !important;
}


/* =========================
   LINKS / SWITCH
========================= */

.auth-switch button,
.back-button,
a {
    color:
        var(--rauda-green-2);
}

.auth-switch button:hover {
    background:
        var(--rauda-gold-soft) !important;
}


/* =========================
   SUCCESS
========================= */

.completed {
    color:
        #39704e !important;
}

.email-status.success {
    background:
        #edf5ef !important;

    color:
        #28583d !important;

    border-color:
        #c9ddcd !important;
}

.email-status.loading {
    background:
        #f6f0e2 !important;

    color:
        #725e36 !important;

    border-color:
        #e3d5b5 !important;
}


/* =========================
   FOCUS
========================= */

button:focus-visible,
