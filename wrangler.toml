name = "rauda-ilm-app"
main = "backend/src/index.js"
compatibility_date = "2026-08-30"

# ...
[vars]
APP_NAME = "RAUDA ILM"
CHECKOUT_CLAIM_TTL_HOURS = "72"
CORS_ORIGIN = "https://rauda-ilm-app.team-rauda-ilm.workers.dev"
EMAIL_FROM = "team.rauda.ilm@gmail.com"
EMAIL_PROVIDER = "brevo"
GOOGLE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby573CHHp5DdQP0gFKVtxFJAxbC0v7oG0SqlWRNWoLhR240G8d4D83Dbeh3eynz0aa0/exec"
OWNER_TELEGRAM_ID = "7714575966"
PUBLIC_APP_URL = "https://app.rauda-ilm.com"
TELEGRAM_BOT_USERNAME = "Rauda_ilmapp_bot"
TELEGRAM_CLIENT_ID = "8961703841"
# ... "7714575966"

[secrets]
required = [
  "TELEGRAM_BOT_TOKEN",
  "TELEGRAM_WEBHOOK_SECRET",
  "BREVO_API_KEY",
  "EMAIL_AUTH_SECRET",
  "TRIBUTE_API_KEY"
]

# Configure YOOKASSA_SHOP_ID and YOOKASSA_SECRET_KEY as Worker secrets before
# enabling YooKassa in school settings. They remain optional until credentials exist.

[[d1_databases]]
binding = "DB"
database_name = "rauda-ilm-db"
database_id = "11acb8cd-6a32-4daa-8d58-dc031853084c"
migrations_dir = "database/migrations"

[assets]
directory = "./frontend"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[r2_buckets]]
binding = "FILES"
bucket_name = "rauda-ilm-media"

[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "26092101"

[ratelimits.simple]
limit = 10
period = 60

[[ratelimits]]
name = "TELEGRAM_RATE_LIMITER"
namespace_id = "26092102"

[ratelimits.simple]
limit = 30
period = 60

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

